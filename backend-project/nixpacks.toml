[build]
  # Mencoba menggunakan image base yang mendukung docker-compose (namun ini tidak selalu berhasil)
  image = "docker:20.10.21"

  build_command = "docker-compose up -d"

  [build]
  # Memaksa penggunaan Dockerfile
  use_dockerfile = true

[env]
  # Tambahkan variabel lingkungan jika diperlukan
  NODE_ENV = "production"

