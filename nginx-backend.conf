server {
    listen 80;
    server_name your-backend-domain;  # Nanti URL Railway akan menjadi domain ini, misalnya: your-backend.railway.app

    # Proxy untuk Prometheus
    location /prometheus/ {
        proxy_pass http://prometheus:9090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy untuk Grafana
    location /grafana/ {
        proxy_pass http://grafana:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
